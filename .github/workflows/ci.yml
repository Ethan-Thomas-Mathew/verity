name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        run: pipx install uv==0.11.32
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: verity
          POSTGRES_PASSWORD: verity
          POSTGRES_DB: verity
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U verity"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PGPASSWORD: verity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install uv
        run: pipx install uv==0.11.32
      - name: Create test databases
        run: |
          psql -h 127.0.0.1 -p 5433 -U verity -d verity -c "CREATE DATABASE shelf_test"
          psql -h 127.0.0.1 -p 5433 -U verity -d verity -c "CREATE DATABASE verity_test"
      - run: uv sync --frozen
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Tests (unit, integration, browser, exported pytest and Newman)
        run: uv run pytest --cov --cov-report=term --cov-fail-under=85

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start Postgres, Shelf and the migration
        run: docker compose up -d --build --wait postgres shelf
      - name: Migrate
        run: docker compose run --rm migrate
      - name: Start the API
        run: docker compose --profile full up -d --wait api
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8001/health
          curl -fsS "http://127.0.0.1:8001/api/books?q=hobbit" | grep -q "The Hobbit"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ready && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/stories | grep -q SHELF-3
      - name: Logs on failure
        if: failure()
        run: docker compose --profile full logs
